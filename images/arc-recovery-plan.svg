<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><defs>
<marker id="normal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#245f9c"/></marker>
<marker id="risk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b85b16"/></marker>
<marker id="human" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7252a3"/></marker>
<marker id="plain" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526479"/></marker>
</defs><rect width="1400" height="1100" fill="white"/><g font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif">
<text x="52" y="58.0" font-size="32" font-weight="600" fill="#243447" text-anchor="start">ARC：手順を統合しても、DBの保証範囲は変わらない</text>
<text x="52" y="103.0" font-size="21" font-weight="400" fill="#526479" text-anchor="start">公式チュートリアルの主要ブロックを抜粋。完全な実装手順・災害時Failoverの安全性を示す図ではない</text>
<rect x="52" y="175" width="294" height="210" rx="10" fill="#eff5fc" stroke="#cbd5e1" stroke-width="2"/>
<image href="data:image/svg+xml;base64," x="74" y="197" width="52" height="52"/>
<text x="144" y="218.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">EC2容量</text>
<text x="76" y="287.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">待機側の容量を準備</text>
<rect x="386" y="175" width="294" height="210" rx="10" fill="#f4f0fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="410" y="218.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">手動承認</text>
<text x="410" y="265.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">IAMロールで承認</text>
<text x="410" y="299.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">承認待ちで停止</text>
<rect x="720" y="175" width="294" height="210" rx="10" fill="#eff5fc" stroke="#cbd5e1" stroke-width="2"/>
<image href="data:image/svg+xml;base64," x="742" y="197" width="52" height="52"/>
<text x="812" y="218.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">Aurora</text>
<text x="744" y="287.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">公式例はSwitchover</text>
<text x="744" y="321.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">同期してから切替</text>
<rect x="1054" y="175" width="294" height="210" rx="10" fill="#eff5fc" stroke="#cbd5e1" stroke-width="2"/>
<image href="data:image/svg+xml;base64," x="1076" y="197" width="52" height="52"/>
<text x="1146" y="218.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">経路変更</text>
<text x="1078" y="287.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">ARCでDNSを更新</text>
<text x="1078" y="321.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">既存接続は別に考慮</text>
<path d="M346 280H386" fill="none" stroke="#245f9c" stroke-width="3" marker-end="url(#normal)"/>
<path d="M680 280H720" fill="none" stroke="#245f9c" stroke-width="3" marker-end="url(#normal)"/>
<path d="M1014 280H1054" fill="none" stroke="#245f9c" stroke-width="3" marker-end="url(#normal)"/>
<text x="52" y="437.0" font-size="27" font-weight="600" fill="#243447" text-anchor="start">災害時の経路を設計するときに確認すること</text>
<rect x="52" y="480" width="616" height="270" rx="10" fill="#fff4e8" stroke="#cbd5e1" stroke-width="2"/>
<text x="76" y="523.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">DB操作の選択を確認</text>
<text x="76" y="570.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">SwitchoverとFailoverを区別</text>
<text x="76" y="604.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">FailoverGlobalClusterでは</text>
<text x="76" y="638.08" font-size="23" font-weight="400" fill="#243447" text-anchor="start">AllowDataLoss=trueとなる構成がある</text>
<text x="76" y="672.12" font-size="23" font-weight="400" fill="#243447" text-anchor="start">欠損・分岐の扱いを別途設計</text>
<rect x="732" y="480" width="616" height="270" rx="10" fill="#f4f0fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="756" y="523.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">承認境界をモード別に確認</text>
<text x="756" y="570.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">Manual approvalブロックは</text>
<text x="756" y="604.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">Ungracefulモード非対応</text>
<text x="756" y="638.08" font-size="23" font-weight="400" fill="#243447" text-anchor="start">緊急操作の権限・手順も確認</text>
<text x="756" y="672.12" font-size="23" font-weight="400" fill="#243447" text-anchor="start">必要な承認が成立するか試験</text>
<rect x="52" y="810" width="1296" height="88" rx="10" fill="#fff4e8" stroke="none" stroke-width="2"/>
<text x="700" y="863.0" font-size="26" font-weight="600" fill="#243447" text-anchor="middle">Gracefulモードでも、DBがFailover設定ならデータ損失を許容する</text>
<text x="700" y="977.0" font-size="23" font-weight="600" fill="#243447" text-anchor="middle">ARCの実行管理は、非同期複製やベストエフォートのフェンシングを強い保証に変えない</text>
<text x="52" y="1075.0" font-size="19" font-weight="400" fill="#526479" text-anchor="start">公式例 [24]、Manual approval [25]、Aurora実行ブロック [26]。AWS公式アイコンを使用 [17]。</text></g></svg>