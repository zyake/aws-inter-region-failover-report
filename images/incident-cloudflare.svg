<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080"><defs>
<marker id="normal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#245f9c"/></marker>
<marker id="risk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b85b16"/></marker>
<marker id="human" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7252a3"/></marker>
<marker id="plain" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526479"/></marker>
</defs><rect width="1400" height="1080" fill="white"/><g font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif">
<text x="52" y="58.0" font-size="32" font-weight="600" fill="#243447" text-anchor="start">Cloudflare｜冗長化の外側に、依存が残っていた</text>
<text x="52" y="103.0" font-size="21" font-weight="400" fill="#526479" text-anchor="start">2023年11月2日：コントロールプレーン・分析サービスの障害</text>
<rect x="52" y="155" width="616" height="155" rx="10" fill="#eff5fc" stroke="#cbd5e1" stroke-width="2"/>
<text x="76" y="198.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">高可用なクラスタ上のサービス</text>
<text x="76" y="245.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">他のデータセンターで引き継ぐ設計</text>
<rect x="850" y="155" width="498" height="155" rx="10" fill="#fff4e8" stroke="#cbd5e1" stroke-width="2"/>
<text x="874" y="198.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">PDX-04のみに存在する依存先</text>
<text x="874" y="245.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">Kafka・ClickHouseなど</text>
<path d="M668 233H850" fill="none" stroke="#b85b16" stroke-width="3" marker-end="url(#risk)"/>
<text x="750" y="210.0" font-size="22" font-weight="400" fill="#243447" text-anchor="middle">依存</text>
<rect x="818" y="135" width="550" height="205" rx="12" fill="none" stroke="#b85b16" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1095" y="382.0" font-size="26" font-weight="600" fill="#243447" text-anchor="middle">拠点全体の電源障害</text>
<path d="M1099 399V430" fill="none" stroke="#b85b16" stroke-width="3" marker-end="url(#risk)"/>
<rect x="52" y="430" width="616" height="170" rx="10" fill="#fff4e8" stroke="#cbd5e1" stroke-width="2"/>
<text x="76" y="473.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">試験の抜け</text>
<text x="76" y="520.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">一部のHA機能停止は試験済み</text>
<text x="76" y="554.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">PDX-04施設全体の停止は未試験</text>
<rect x="732" y="430" width="616" height="170" rx="10" fill="#fff4e8" stroke="#cbd5e1" stroke-width="2"/>
<text x="756" y="473.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">期待どおりに回復しない</text>
<text x="756" y="520.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">隠れた依存・DR未整備が顕在化</text>
<text x="756" y="554.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">一部サービスに手動設定が必要</text>
<path d="M1040 600V660" fill="none" stroke="#7252a3" stroke-width="3" marker-end="url(#human)"/>
<rect x="200" y="660" width="1000" height="155" rx="10" fill="#f4f0fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="224" y="703.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">人の対応：DR設定と、依存順の再立上げ</text>
<text x="224" y="750.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">一部システムを手動設定</text>
<text x="224" y="784.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">構成管理サーバーから施設のブートストラップを実施</text>
<rect x="52" y="855" width="1296" height="88" rx="10" fill="#f4f0fa" stroke="none" stroke-width="2"/>
<text x="700" y="908.0" font-size="26" font-weight="600" fill="#243447" text-anchor="middle">教訓：部品の冗長化に加え、拠点喪失時の復旧経路全体を試験する</text>
<text x="700" y="991.0" font-size="21" font-weight="400" fill="#243447" text-anchor="middle">対象はコントロールプレーン・分析。一律に全データプレーンが停止した事例ではない。</text>
<text x="52" y="1055.0" font-size="19" font-weight="400" fill="#526479" text-anchor="start">出典：Cloudflare公式ポストモーテム [20]。依存関係は説明のために簡略化している。</text></g></svg>