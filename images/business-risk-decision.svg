<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120"><defs>
<marker id="normal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#245f9c"/></marker>
<marker id="risk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b85b16"/></marker>
<marker id="human" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7252a3"/></marker>
<marker id="plain" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526479"/></marker>
</defs><rect width="1400" height="1120" fill="white"/><g font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif">
<text x="52" y="58.0" font-size="32" font-weight="600" fill="#243447" text-anchor="start">自動開始の判断：業務の損失を具体的に比較する</text>
<text x="52" y="103.0" font-size="21" font-weight="400" fill="#526479" text-anchor="start">次の条件は検討材料であり、どれか一つで安全性が保証されるわけではない</text>
<rect x="52" y="160" width="616" height="280" rx="10" fill="#eff5fc" stroke="#cbd5e1" stroke-width="2"/>
<text x="76" y="203.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">参照中心・更新が少ない</text>
<text x="76" y="250.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">欠損・競合する更新量を限定しやすい</text>
<text x="76" y="284.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start"></text>
<text x="76" y="318.08" font-size="23" font-weight="400" fill="#243447" text-anchor="start">少数でも重要な更新は残る</text>
<text x="76" y="352.12" font-size="23" font-weight="400" fill="#243447" text-anchor="start">古い権限・設定を読ませる影響も評価</text>
<rect x="732" y="160" width="616" height="280" rx="10" fill="#eff5fc" stroke="#cbd5e1" stroke-width="2"/>
<text x="756" y="203.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">復元・再処理できる</text>
<text x="756" y="250.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">別原本や履歴から状態を再構成できる</text>
<text x="756" y="284.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start"></text>
<text x="756" y="318.08" font-size="23" font-weight="400" fill="#243447" text-anchor="start">原本の耐障害範囲を確認</text>
<text x="756" y="352.12" font-size="23" font-weight="400" fill="#243447" text-anchor="start">重複・欠落・外部副作用を照合</text>
<rect x="52" y="485" width="616" height="280" rx="10" fill="#fff4e8" stroke="#cbd5e1" stroke-width="2"/>
<text x="76" y="528.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">停止による損失が大きい</text>
<text x="76" y="575.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">再開の利益が残余リスクを上回るか</text>
<text x="76" y="609.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start"></text>
<text x="76" y="643.08" font-size="23" font-weight="400" fill="#243447" text-anchor="start">データの種類・件数・金額・補償期限へ</text>
<text x="76" y="677.12" font-size="23" font-weight="400" fill="#243447" text-anchor="start">許容範囲を具体化する</text>
<rect x="732" y="485" width="616" height="280" rx="10" fill="#f4f0fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="756" y="528.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">追加制御と検証へ投資する</text>
<text x="756" y="575.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">想定した障害で欠損・分岐を抑える</text>
<text x="756" y="609.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start"></text>
<text x="756" y="643.08" font-size="23" font-weight="400" fill="#243447" text-anchor="start">閉塞・遮断・同期確認が不能なら</text>
<text x="756" y="677.12" font-size="23" font-weight="400" fill="#243447" text-anchor="start">待つのか進むのかを事前に決める</text>
<rect x="52" y="830" width="1296" height="92" rx="10" fill="#fff4e8" stroke="none" stroke-width="2"/>
<text x="700" y="883.0" font-size="26" font-weight="600" fill="#243447" text-anchor="middle">非ゼロRPOの承認は、二つの更新履歴の分岐まで許す承認とは限らない</text>
<text x="700" y="1012.0" font-size="25" font-weight="600" fill="#243447" text-anchor="middle">条件不足や確認不能は、待機・縮退・エスカレーションの経路へ</text>
<text x="52" y="1095.0" font-size="19" font-weight="400" fill="#526479" text-anchor="start">公開仕様・事例を踏まえた本レポートの設計提案。発生確率・期待損失の測定値を示す図ではない。</text></g></svg>