<marker id="risk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b85b16"/></marker>
<marker id="human" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7252a3"/></marker>
<marker id="plain" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526479"/></marker>
</defs><rect width="1400" height="1010" fill="white"/><g font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif">
<text x="52" y="58.0" font-size="32" font-weight="600" fill="#243447" text-anchor="start">GitHub｜自動切替が終わっても、安全に切り戻せない</text>
<text x="52" y="103.0" font-size="21" font-weight="400" fill="#526479" text-anchor="start">2018年10月21日：MySQLの拠点間自動フェイルオーバー</text>
<rect x="52" y="150" width="392" height="150" rx="10" fill="#fff4e8" stroke="#cbd5e1" stroke-width="2"/>
<text x="76" y="193.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">43秒のネットワーク分断</text>
<text x="76" y="240.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">東海岸の接続性を喪失</text>
<rect x="504" y="150" width="392" height="150" rx="10" fill="#eff5fc" stroke="#cbd5e1" stroke-width="2"/>
<text x="528" y="193.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">自動フェイルオーバー</text>
<text x="528" y="240.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">西海岸へ書き込み先を移す</text>
<rect x="956" y="150" width="392" height="150" rx="10" fill="#eff5fc" stroke="#cbd5e1" stroke-width="2"/>
<text x="980" y="193.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">接続回復後</text>
<text x="980" y="240.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">アプリが西海岸へ書き込む</text>
<path d="M444 225H504" fill="none" stroke="#b85b16" stroke-width="3" marker-end="url(#risk)"/>
<path d="M896 225H956" fill="none" stroke="#245f9c" stroke-width="3" marker-end="url(#normal)"/>
<rect x="52" y="375" width="616" height="170" rx="10" fill="#fff4e8" stroke="#cbd5e1" stroke-width="2"/>
<text x="76" y="418.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">東海岸に残った更新</text>
<text x="76" y="465.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">西海岸に複製されていない</text>
<text x="76" y="499.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">数秒分の書き込み</text>
<rect x="732" y="375" width="616" height="170" rx="10" fill="#fff4e8" stroke="#cbd5e1" stroke-width="2"/>
<text x="756" y="418.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">西海岸で増えた更新</text>
<text x="756" y="465.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">自動切替後のアプリの書き込み</text>
<text x="756" y="499.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">東海岸には存在しない</text>
<path d="M360 545V590H700V635" fill="none" stroke="#b85b16" stroke-width="3" marker-end="url(#risk)"/>
<path d="M1040 545V590H700V635" fill="none" stroke="#b85b16" stroke-width="3" marker-end="url(#risk)"/>
<rect x="312" y="635" width="776" height="150" rx="10" fill="#f4f0fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="336" y="678.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">人の対応：データ保全を優先して復旧</text>
<text x="336" y="725.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">責任者・DB専門家を招集し、変更を制限</text>
<text x="336" y="759.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">即時の切戻しを避け、履歴と構成を回復</text>
<rect x="52" y="825" width="1296" height="88" rx="10" fill="#f4f0fa" stroke="none" stroke-width="2"/>
<text x="700" y="878.0" font-size="26" font-weight="600" fill="#243447" text-anchor="middle">教訓：自動切替の成功後も、履歴と業務の復旧判断が残る</text>
<text x="700" y="948.0" font-size="22" font-weight="400" fill="#243447" text-anchor="middle">関連するサービス劣化：24時間11分（同時書き込みの継続時間ではない）</text>
<text x="52" y="985.0" font-size="19" font-weight="400" fill="#526479" text-anchor="start">出典：GitHub公式ポストモーテム [12]。長時間の同時書き込みまでは、この報告から断定しない。</text></g></svg>