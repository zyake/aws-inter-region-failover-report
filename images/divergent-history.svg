<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs>
<marker id="normal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#245f9c"/></marker>
<marker id="risk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b85b16"/></marker>
<marker id="human" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7252a3"/></marker>
<marker id="plain" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526479"/></marker>
</defs><rect width="1400" height="900" fill="white"/><g font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif">
<text x="52" y="58.0" font-size="32" font-weight="600" fill="#243447" text-anchor="start">データの欠落と、履歴の分岐は異なる</text>
<text x="52" y="103.0" font-size="21" font-weight="400" fill="#526479" text-anchor="start">それぞれのDBが内部的に整合していても、両者の内容は一致しない</text>
<rect x="470" y="150" width="460" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="494" y="193.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">共通の履歴</text>
<path d="M700 250V295H360V340" fill="none" stroke="#245f9c" stroke-width="3" marker-end="url(#normal)"/>
<path d="M700 295H1040V340" fill="none" stroke="#b85b16" stroke-width="3" marker-end="url(#risk)"/>
<rect x="52" y="340" width="616" height="155" rx="10" fill="#eff5fc" stroke="#cbd5e1" stroke-width="2"/>
<text x="76" y="383.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">旧プライマリA：共通履歴 + α</text>
<text x="76" y="430.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">αはBに存在しない</text>
<rect x="732" y="340" width="616" height="155" rx="10" fill="#fff4e8" stroke="#cbd5e1" stroke-width="2"/>
<text x="756" y="383.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">新プライマリB：共通履歴 + β</text>
<text x="756" y="430.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">βはAに存在しない</text>
<rect x="52" y="560" width="616" height="160" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="76" y="603.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">欠落への対応</text>
<text x="76" y="650.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">復旧時点・欠落範囲を評価</text>
<text x="76" y="684.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">残存データを保全する</text>
<rect x="732" y="560" width="616" height="160" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="756" y="603.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">分岐への対応</text>
<text x="756" y="650.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">正とする履歴を決定</text>
<text x="756" y="684.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">競合更新を照合・業務上の修復</text>
<rect x="52" y="760" width="1296" height="88" rx="10" fill="#f4f0fa" stroke="none" stroke-width="2"/>
<text x="700" y="813.0" font-size="26" font-weight="600" fill="#243447" text-anchor="middle">旧リージョンの再構築は、競合した業務データの自動マージではない</text>
<text x="52" y="875.0" font-size="19" font-weight="400" fill="#526479" text-anchor="start">α・βは説明用の書き込み。マネージド復旧は旧ボリュームのスナップショット取得を試みる。[5]</text></g></svg>