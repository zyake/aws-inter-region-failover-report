<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><defs>
<marker id="normal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#245f9c"/></marker>
<marker id="risk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b85b16"/></marker>
<marker id="human" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7252a3"/></marker>
<marker id="plain" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526479"/></marker>
</defs><rect width="1400" height="720" fill="white"/><g font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif">
<text x="52" y="58.0" font-size="32" font-weight="600" fill="#243447" text-anchor="start">復旧を判断する、4つの独立した条件</text>
<text x="52" y="103.0" font-size="21" font-weight="400" fill="#526479" text-anchor="start">APIの成功だけでなく、観測・権限・データ・業務の各条件を確認する</text>
<rect x="52" y="160" width="312" height="124" rx="10" fill="#eff5fc" stroke="#cbd5e1" stroke-width="2"/>
<text x="76" y="203.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">観測</text>
<text x="74" y="322.0" font-size="21" font-weight="600" fill="#245f9c" text-anchor="start">自動化で確認・実行</text>
<text x="74" y="365.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">複数地点と業務処理の成</text>
<text x="74" y="399.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">否</text>
<text x="74" y="459.0" font-size="21" font-weight="600" fill="#7252a3" text-anchor="start">不明な場合に残る判断</text>
<text x="74" y="502.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">食い違いの原因を調査</text>
<rect x="380" y="160" width="312" height="124" rx="10" fill="#eff5fc" stroke="#cbd5e1" stroke-width="2"/>
<text x="404" y="203.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">書き込み権限</text>
<text x="402" y="322.0" font-size="21" font-weight="600" fill="#245f9c" text-anchor="start">自動化で確認・実行</text>
<text x="402" y="365.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">旧権限の書き込みを排除</text>
<text x="402" y="459.0" font-size="21" font-weight="600" fill="#7252a3" text-anchor="start">不明な場合に残る判断</text>
<text x="402" y="502.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">停止・継続の方針を判断</text>
<rect x="708" y="160" width="312" height="124" rx="10" fill="#eff5fc" stroke="#cbd5e1" stroke-width="2"/>
<text x="732" y="203.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">データ</text>
<text x="730" y="322.0" font-size="21" font-weight="600" fill="#245f9c" text-anchor="start">自動化で確認・実行</text>
<text x="730" y="365.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">複製状況と復旧時点</text>
<text x="730" y="459.0" font-size="21" font-weight="600" fill="#7252a3" text-anchor="start">不明な場合に残る判断</text>
<text x="730" y="502.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">欠落・競合の扱いを判断</text>
<rect x="1036" y="160" width="312" height="124" rx="10" fill="#eff5fc" stroke="#cbd5e1" stroke-width="2"/>
<text x="1060" y="203.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">業務の回復</text>
<text x="1058" y="322.0" font-size="21" font-weight="600" fill="#245f9c" text-anchor="start">自動化で確認・実行</text>
<text x="1058" y="365.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">接続先・依存先・容量</text>
<text x="1058" y="459.0" font-size="21" font-weight="600" fill="#7252a3" text-anchor="start">不明な場合に残る判断</text>
<text x="1058" y="502.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">途中失敗からの復旧を指</text>
<text x="1058" y="536.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">揮</text>
<rect x="52" y="575" width="1296" height="78" rx="10" fill="#f4f0fa" stroke="none" stroke-width="2"/>
<text x="700" y="628.0" font-size="26" font-weight="600" fill="#243447" text-anchor="middle">適用条件・完了条件・引継ぎ条件を、一つの復旧設計にする</text>
<text x="52" y="695.0" font-size="19" font-weight="400" fill="#526479" text-anchor="start">本レポートの設計上の整理。単一ライターの整合性を重視するシステムを主な対象とする。</text></g></svg>