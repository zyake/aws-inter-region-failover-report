<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1110" viewBox="0 0 1400 1110"><defs>
<marker id="normal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#245f9c"/></marker>
<marker id="risk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b85b16"/></marker>
<marker id="human" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7252a3"/></marker>
<marker id="plain" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526479"/></marker>
</defs><rect width="1400" height="1110" fill="white"/><g font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif">
<text x="52" y="58.0" font-size="32" font-weight="600" fill="#243447" text-anchor="start">作れることに加え、維持し続けられることを評価する</text>
<text x="52" y="103.0" font-size="21" font-weight="400" fill="#526479" text-anchor="start">Google等の事例を参考にするときも、事業の需要と運用能力を含める</text>
<rect x="52" y="160" width="616" height="310" rx="10" fill="#eff5fc" stroke="#cbd5e1" stroke-width="2"/>
<text x="76" y="203.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">得られる事業上の利益</text>
<text x="76" y="250.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">停止時間と顧客影響の削減</text>
<text x="76" y="284.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">復旧操作の時間・ミスの削減</text>
<text x="76" y="318.08" font-size="23" font-weight="400" fill="#243447" text-anchor="start">事業継続・契約上の目標への対応</text>
<text x="76" y="352.12" font-size="23" font-weight="400" fill="#243447" text-anchor="start"></text>
<text x="76" y="386.15999999999997" font-size="23" font-weight="400" fill="#243447" text-anchor="start">どの業務に、どれだけ必要かを定義</text>
<rect x="732" y="160" width="616" height="310" rx="10" fill="#fff4e8" stroke="#cbd5e1" stroke-width="2"/>
<text x="756" y="203.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">継続して必要な費用と能力</text>
<text x="756" y="250.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">待機インフラ・複製・転送</text>
<text x="756" y="284.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">実装と改修後の再検証</text>
<text x="756" y="318.08" font-size="23" font-weight="400" fill="#243447" text-anchor="start">オンコール・専門家・支援契約</text>
<text x="756" y="352.12" font-size="23" font-weight="400" fill="#243447" text-anchor="start">訓練・照合・切戻し</text>
<text x="756" y="386.15999999999997" font-size="23" font-weight="400" fill="#243447" text-anchor="start">他の開発を行えなくなる機会費用</text>
<rect x="52" y="530" width="616" height="245" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="76" y="573.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">取り入れる原則</text>
<text x="76" y="620.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">業務からSLO・RTO・RPOを決める</text>
<text x="76" y="654.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">責任者・権限・引継ぎを明確にする</text>
<text x="76" y="688.08" font-size="23" font-weight="400" fill="#243447" text-anchor="start">復元と切替を試し、改善する</text>
<rect x="732" y="530" width="616" height="245" rx="10" fill="#f4f0fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="756" y="573.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">自社で再現する範囲</text>
<text x="756" y="620.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">独自の判定・分散基盤が必要か</text>
<text x="756" y="654.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">単一リージョンで目標を満たすか</text>
<text x="756" y="688.08" font-size="23" font-weight="400" fill="#243447" text-anchor="start">自社・外部支援で維持できるか</text>
<rect x="52" y="830" width="1296" height="92" rx="10" fill="#f4f0fa" stroke="none" stroke-width="2"/>
<text x="700" y="883.0" font-size="26" font-weight="600" fill="#243447" text-anchor="middle">基盤管理を委ねても、アプリの連携・照合・業務判断の費用は別に残る</text>
<text x="700" y="1008.0" font-size="23" font-weight="600" fill="#243447" text-anchor="middle">会社の大きさだけでなく、追加の複雑さを必要とするワークロードがあるかを見る</text>
<text x="52" y="1085.0" font-size="19" font-weight="400" fill="#526479" text-anchor="start">Google SRE [39][40]、AWSの要件・運用指針 [38][9] に基づく設計上の整理。数量的なROI図ではない。</text></g></svg>