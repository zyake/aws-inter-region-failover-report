<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"><defs>
<marker id="normal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#245f9c"/></marker>
<marker id="risk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b85b16"/></marker>
<marker id="human" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7252a3"/></marker>
<marker id="plain" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526479"/></marker>
</defs><rect width="1400" height="990" fill="white"/><g font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif">
<text x="52" y="58.0" font-size="32" font-weight="600" fill="#243447" text-anchor="start">マネージドフェイルオーバー：フェンシングの結果を区別する</text>
<text x="52" y="103.0" font-size="21" font-weight="400" fill="#526479" text-anchor="start">旧プライマリへの書き込み停止はベストエフォート。DNS変更とは別の状態である</text>
<rect x="425" y="150" width="550" height="120" rx="10" fill="#eff5fc" stroke="#cbd5e1" stroke-width="2"/>
<image href="data:image/svg+xml;base64," x="447" y="172" width="52" height="52"/>
<text x="517" y="193.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">旧プライマリの書き込み停止を試行</text>
<path d="M700 270V310H360V355" fill="none" stroke="#245f9c" stroke-width="3" marker-end="url(#normal)"/>
<path d="M700 310H1040V355" fill="none" stroke="#b85b16" stroke-width="3" marker-end="url(#risk)"/>
<rect x="52" y="355" width="616" height="145" rx="10" fill="#eff5fc" stroke="#cbd5e1" stroke-width="2"/>
<text x="76" y="398.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">成功：RDS-EVENT-0390</text>
<text x="76" y="445.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">ストレージ層で書き込みをブロック</text>
<rect x="732" y="355" width="616" height="145" rx="10" fill="#fff4e8" stroke="#cbd5e1" stroke-width="2"/>
<text x="756" y="398.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">タイムアウト：RDS-EVENT-0391</text>
<text x="756" y="445.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">フェイルオーバー処理は継続する</text>
<path d="M360 500V550" fill="none" stroke="#245f9c" stroke-width="3" marker-end="url(#normal)"/>
<path d="M1040 500V550" fill="none" stroke="#b85b16" stroke-width="3" marker-end="url(#risk)"/>
<rect x="52" y="550" width="616" height="175" rx="10" fill="#eff5fc" stroke="#cbd5e1" stroke-width="2"/>
<text x="76" y="593.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">旧Aへの新たな書き込みを拒否</text>
<text x="76" y="640.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">古い接続 → A：拒否</text>
<text x="76" y="674.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">新しい接続 → B：成功</text>
<rect x="732" y="550" width="616" height="175" rx="10" fill="#fff4e8" stroke="#cbd5e1" stroke-width="2"/>
<text x="756" y="593.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">旧Aへの書き込みが残る可能性</text>
<text x="756" y="640.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">古い接続 → A：一時的に成功し得る</text>
<text x="756" y="674.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">新しい接続 → B：成功</text>
<rect x="52" y="775" width="1296" height="88" rx="10" fill="#fff4e8" stroke="none" stroke-width="2"/>
<text x="700" y="828.0" font-size="26" font-weight="600" fill="#243447" text-anchor="middle">RDS-EVENT-0397：DNS変更完了 ≠ 旧ライターの停止成功</text>
<text x="700" y="909.0" font-size="25" font-weight="600" fill="#243447" text-anchor="middle">フェンシングに成功しても、未複製データの欠落は別問題</text>
<text x="52" y="965.0" font-size="19" font-weight="400" fill="#526479" text-anchor="start">内部の厳密な処理順序を示す図ではない。出典：Auroraのマネージドフェイルオーバー・イベント [5][6]。</text></g></svg>