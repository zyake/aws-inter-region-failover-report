<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="970" viewBox="0 0 1400 970"><defs>
<marker id="normal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#245f9c"/></marker>
<marker id="risk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b85b16"/></marker>
<marker id="human" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7252a3"/></marker>
<marker id="plain" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526479"/></marker>
</defs><rect width="1400" height="970" fill="white"/><g font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif">
<text x="52" y="58.0" font-size="32" font-weight="600" fill="#243447" text-anchor="start">Google Cloud｜復旧に使うツールも、障害の影響を受けた</text>
<text x="52" y="103.0" font-size="21" font-weight="400" fill="#526479" text-anchor="start">2019年6月2日：保守自動化・設定・ソフトウェア不具合が組み合わさった障害</text>
<rect x="52" y="155" width="392" height="150" rx="10" fill="#fff4e8" stroke="#cbd5e1" stroke-width="2"/>
<text x="76" y="198.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">保守イベントの自動化</text>
<text x="76" y="245.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">複数拠点の制御ジョブを停止</text>
<rect x="504" y="155" width="392" height="150" rx="10" fill="#fff4e8" stroke="#cbd5e1" stroke-width="2"/>
<text x="528" y="198.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">ネットワーク容量が低下</text>
<text x="528" y="245.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">混雑・パケット損失が発生</text>
<rect x="956" y="155" width="392" height="150" rx="10" fill="#fff4e8" stroke="#cbd5e1" stroke-width="2"/>
<text x="980" y="198.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">調査・復旧ツールも影響</text>
<text x="980" y="245.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">同じ混雑したネットワークを利</text>
<text x="980" y="279.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">用</text>
<path d="M444 230H504" fill="none" stroke="#b85b16" stroke-width="3" marker-end="url(#risk)"/>
<path d="M896 230H956" fill="none" stroke="#b85b16" stroke-width="3" marker-end="url(#risk)"/>
<path d="M1152 305V353H700V410" fill="none" stroke="#b85b16" stroke-width="3" marker-end="url(#risk)"/>
<rect x="312" y="410" width="776" height="155" rx="10" fill="#fff4e8" stroke="#cbd5e1" stroke-width="2"/>
<text x="336" y="453.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">通常の調査・操作が難しくなる</text>
<text x="336" y="500.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">障害の把握・操作・情報共有に支障</text>
<text x="336" y="534.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">自動化を直すための経路も弱くなる</text>
<path d="M700 565V625" fill="none" stroke="#7252a3" stroke-width="3" marker-end="url(#human)"/>
<rect x="200" y="625" width="1000" height="155" rx="10" fill="#f4f0fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="224" y="668.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">人の対応：原因の自動化を停止し、代替手段で復旧</text>
<text x="224" y="715.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">ネットワーク制御系と構成を再び立ち上げる</text>
<text x="224" y="749.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">通常ツールの障害に備えたバックアップ手段を使用</text>
<rect x="52" y="820" width="1296" height="88" rx="10" fill="#f4f0fa" stroke="none" stroke-width="2"/>
<text x="700" y="873.0" font-size="26" font-weight="600" fill="#243447" text-anchor="middle">教訓：対象サービスと、復旧のための操作経路を同時に試験する</text>
<text x="52" y="945.0" font-size="19" font-weight="400" fill="#526479" text-anchor="start">出典：Google Cloud Networking Incident #19009 [19]。すべてのリージョンが停止したという意味ではない。</text></g></svg>