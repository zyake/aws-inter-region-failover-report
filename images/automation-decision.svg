<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910"><defs>
<marker id="normal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#245f9c"/></marker>
<marker id="risk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b85b16"/></marker>
<marker id="human" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7252a3"/></marker>
<marker id="plain" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526479"/></marker>
</defs><rect width="1400" height="910" fill="white"/><g font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif">
<text x="52" y="58.0" font-size="32" font-weight="600" fill="#243447" text-anchor="start">リージョン切替：開始判断と実行を分ける</text>
<text x="52" y="103.0" font-size="21" font-weight="400" fill="#526479" text-anchor="start">非同期複製の単一ライター構成で、人が開始を判断する基準案</text>
<rect x="52" y="160" width="390" height="170" rx="10" fill="#eff5fc" stroke="#cbd5e1" stroke-width="2"/>
<image href="data:image/svg+xml;base64," x="74" y="182" width="52" height="52"/>
<text x="144" y="203.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">観測・調査支援</text>
<text x="76" y="272.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">複数地点の業務疎通</text>
<text x="76" y="306.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">複製状況・監視の鮮度</text>
<rect x="505" y="160" width="390" height="170" rx="10" fill="#f4f0fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="529" y="203.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">人が開始を判断</text>
<text x="529" y="250.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">停止継続と再開の影響</text>
<text x="529" y="284.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">欠損・不明点を評価</text>
<rect x="958" y="160" width="390" height="170" rx="10" fill="#eff5fc" stroke="#cbd5e1" stroke-width="2"/>
<image href="data:image/svg+xml;base64," x="980" y="182" width="52" height="52"/>
<text x="1050" y="203.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">自動実行</text>
<text x="982" y="272.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">検証済み手順を起動</text>
<text x="982" y="306.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">結果と途中状態を記録</text>
<path d="M442 245H505" fill="none" stroke="#7252a3" stroke-width="3" marker-end="url(#human)"/>
<path d="M895 245H958" fill="none" stroke="#245f9c" stroke-width="3" marker-end="url(#normal)"/>
<text x="52" y="397.0" font-size="27" font-weight="600" fill="#243447" text-anchor="start">それぞれに必要な条件</text>
<rect x="52" y="435" width="390" height="250" rx="10" fill="#fff4e8" stroke="#cbd5e1" stroke-width="2"/>
<text x="76" y="478.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">観測だけでは確定しない</text>
<text x="76" y="525.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">応答なし ≠ 旧DBの停止</text>
<text x="76" y="559.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">最終観測後の更新も不明</text>
<text x="76" y="593.08" font-size="23" font-weight="400" fill="#243447" text-anchor="start">誤検知・見逃しを想定</text>
<rect x="505" y="435" width="390" height="250" rx="10" fill="#f4f0fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="529" y="478.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">承認は保証を増やさない</text>
<text x="529" y="525.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">人も最終状態が不明な場合があ</text>
<text x="529" y="559.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">る</text>
<text x="529" y="593.08" font-size="23" font-weight="400" fill="#243447" text-anchor="start">旧書き込みの排除は別条件</text>
<text x="529" y="627.12" font-size="23" font-weight="400" fill="#243447" text-anchor="start">手動開始 ≠ 欠損ゼロの保証</text>
<rect x="958" y="435" width="390" height="250" rx="10" fill="#eff5fc" stroke="#cbd5e1" stroke-width="2"/>
<text x="982" y="478.0" font-size="25" font-weight="600" fill="#243447" text-anchor="start">実行成功だけで終えない</text>
<text x="982" y="525.0" font-size="23" font-weight="400" fill="#243447" text-anchor="start">旧側の状態と接続を確認</text>
<text x="982" y="559.04" font-size="23" font-weight="400" fill="#243447" text-anchor="start">データと業務を検証</text>
<text x="982" y="593.08" font-size="23" font-weight="400" fill="#243447" text-anchor="start">途中失敗は引継ぎへ</text>
<rect x="52" y="745" width="1296" height="88" rx="10" fill="#f4f0fa" stroke="none" stroke-width="2"/>
<text x="700" y="798.0" font-size="26" font-weight="600" fill="#243447" text-anchor="middle">無人で開始する場合は、適用範囲・損失許容・障害試験を別途示す</text>
<text x="52" y="885.0" font-size="19" font-weight="400" fill="#526479" text-anchor="start">AWSの指針 [9][22] を踏まえた設計上の整理。すべての製品やリージョン内HAに承認を求める図ではない。</text></g></svg>